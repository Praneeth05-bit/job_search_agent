[project]
name = "job-search-agent"
version = "0.1.0"
description = "Evidence-grounded campus opportunity agent"
readme = "README.md"
requires-python = ">=3.12.14,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "google-genai==2.24.0",
    "httpx==0.28.1",
    "langgraph==1.2.11",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "streamlit==1.64.0",
    "structlog==26.1.0",
    "uvicorn==0.53.0",
]

[tool.uv]
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_search_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]